<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>Blockdia Motion · P0</title>
  <style>
    @font-face {
      font-family: "Motion Sans";
      src: url("/font.ttf");
    }
    body {
      margin: 0;
      background: #e8ebf2;
      font-family: "Motion Sans", sans-serif;
    }
    #frame {
      max-width: 1280px;
      margin: auto;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
    footer {
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 18px;
      max-width: 1000px;
      margin: auto;
    }
    input {
      flex: 1;
    }
    button {
      padding: 8px 18px;
    }
    a {
      color: #b72929;
    }
  </style>
  <div id="frame"></div>
  <footer>
    <button id="play">播放</button
    ><input
      id="seek"
      aria-label="时间"
      type="range"
      min="0"
      max="7"
      step="0.033333333333"
    /><output id="time"></output><a href="/artifacts/p0.mp4">下载视频</a
    ><a href="?gallery">兼容性样例</a>
  </footer>
  <script type="module">
    import { frameSvg, DURATION } from "/p0/scene.mjs";
    const assets = await (await fetch("/artifacts/manifest.json")).json();
    await document.fonts.load('16px "Motion Sans"');
    let t = 0,
      playing = false,
      last = 0;
    const frame = document.querySelector("#frame"),
      seek = document.querySelector("#seek"),
      play = document.querySelector("#play");
    window.renderAt = (time, gallery = location.search.includes("gallery")) => {
      t = time;
      frame.innerHTML = frameSvg(t, assets, { gallery });
      seek.value = t;
      document.querySelector("#time").value = t.toFixed(2) + " s";
    };
    play.onclick = () => {
      if (t >= DURATION) t = 0;
      playing = !playing;
      play.textContent = playing ? "暂停" : "播放";
      last = performance.now();
    };
    seek.oninput = () => {
      playing = false;
      play.textContent = "播放";
      window.renderAt(Number(seek.value));
    };
    function tick(now) {
      if (playing) {
        t = Math.min(DURATION, t + (now - last) / 1000);
        window.renderAt(t);
        if (t >= DURATION) {
          playing = false;
          play.textContent = "播放";
        }
      }
      last = now;
      requestAnimationFrame(tick);
    }
    window.renderAt(0);
    window.ready = true;
    requestAnimationFrame(tick);
  </script>
</html>
