<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blockdia Motion</title>
  <style>
    body {
      margin: 0;
      background: #e8ebf2;
      font-family: system-ui, sans-serif;
      color: #575e75;
    }
    main {
      max-width: 1280px;
      margin: auto;
    }
    .motion-frame > svg {
      display: block;
      width: 100%;
      height: auto;
    }
    footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      padding: 18px;
    }
    #player > footer input {
      flex: 1;
      min-width: 60px;
    }
    .toolbar > button,
    #player > footer button {
      padding: 8px 18px;
    }
    output {
      min-width: 120px;
    }
    .toolbar {
      max-width: 1244px;
      margin: auto;
      padding: 18px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .toolbar select {
      max-width: 100%;
      padding: 8px;
      font: inherit;
    }
    .toolbar p {
      flex-basis: 100%;
      margin: 0;
      font-size: 14px;
    }
    #status {
      max-width: 1244px;
      margin: 0 auto;
      padding: 0 18px;
    }
    #error:empty,
    #status:empty {
      display: none;
    }
    #error {
      overflow-wrap: anywhere;
      padding: 20px;
      color: #b72929;
    }
  </style>
  <header class="toolbar">
    <label for="tutorial">教程示例</label>
    <select id="tutorial">
      <option value="/artifacts/playground/tutorial.zh-CN.json">
        客户端准备 · 中英文与舞台视频
      </option>
      <option value="/artifacts/all-api/tutorial.json">全部 API · 底层与交互动画</option>
      <option value="/artifacts/structural-editing/tutorial.json">常规代码编辑</option>
      <option value="/artifacts/basic-editing/tutorial.json">基础编辑</option>
      <option value="/artifacts/targets/tutorial.json">多角色与完整工具箱</option>
    </select>
    <button id="reload" type="button">重新加载</button>
    <label
      >主题
      <select id="theme">
        <option value="light">浅色</option>
        <option value="dark">深色</option>
      </select></label
    >
    <label
      >语言
      <select id="locale">
        <option value="zh-CN">中文</option>
        <option value="en">English</option>
      </select></label
    >
    <label
      >鼠标点按效果
      <select id="cursor-click-effect">
        <option value="circle">点按显示圆圈</option>
        <option value="shrink">点按缩小鼠标</option>
      </select></label
    >
    <label
      >鼠标运动模式
      <select id="cursor-motion">
        <option value="linear">直线运动</option>
        <option value="curve">曲线 + 旋转</option>
      </select></label
    >
    <p id="description"></p>
  </header>
  <p id="status" role="status" aria-live="polite"></p>
  <main id="player" aria-label="教程播放器" aria-busy="true"></main>
  <p id="error" role="alert"></p>
  <script type="module">
    import { mountPlayer } from '/artifacts/runtime/turbowarp-7c58de66-a2946eeb-client-1/modules/renderer-browser/index.js';
    const picker = document.querySelector('#tutorial');
    const host = document.querySelector('#player');
    const status = document.querySelector('#status');
    const errorBox = document.querySelector('#error');
    const themePicker = document.querySelector('#theme');
    const localePicker = document.querySelector('#locale');
    const cursorEffectPicker = document.querySelector('#cursor-click-effect');
    const cursorMotionPicker = document.querySelector('#cursor-motion');
    const examples = {
      '/artifacts/playground/tutorial.zh-CN.json': {
        description:
          '拖动或滚轮平移，Shift+滚轮横移，Control+滚轮缩放；继续播放恢复视角。聚焦画面后方向键平移，0 恢复。支持中英文与浅色、深色切换。',
        command: 'pnpm build',
        variants: true,
      },
      '/artifacts/all-api/tutorial.json': {
        description: '底层编辑、工具箱拖动、原生连接阴影、右键菜单、两种删除、自动输入与角色点击。',
        source: 'all-api',
        output: 'all-api',
      },
      '/artifacts/structural-editing/tutorial.json': {
        description: '容器连接、拆分与删除、长文本输入、模拟输入法、字段菜单和高亮标注。',
        source: 'structural-editing',
        output: 'structural-editing',
      },
      '/artifacts/basic-editing/tutorial.json': {
        description: '从工具箱拖出积木、连接、修改参数与粘贴。',
        source: 'basic-editing',
        output: 'basic-editing',
      },
      '/artifacts/targets/tutorial.json': {
        description: '切换舞台与角色，浏览各自的完整工具箱和局部数据。',
        command: 'pnpm example:targets',
      },
    };
    const initialUrl = new URLSearchParams(location.search).get('scene') || picker.value;
    if (![...picker.options].some((option) => option.value === initialUrl)) {
      picker.add(new Option('自定义教程', initialUrl));
    }
    picker.value = initialUrl;
    let controller;
    let player;
    let generation = 0;
    async function loadScene(url) {
      const current = ++generation;
      controller?.abort();
      controller = new AbortController();
      window.ready = false;
      player?.dispose();
      player = window.player = undefined;
      host.replaceChildren();
      host.setAttribute('aria-busy', 'true');
      errorBox.textContent = '';
      status.textContent = '正在加载教程…';
      const example = Object.hasOwn(examples, url) ? examples[url] : undefined;
      document.querySelector('#description').textContent =
        example?.description || '预览指定的已编译教程。';
      try {
        const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });
        if (!response.ok) {
          const command =
            example?.command ||
            (example?.source
              ? `pnpm build:packages && pnpm motion compile examples/${example.source}/tutorial.ts artifacts/${example.output}/tutorial.json`
              : '请检查 scene 参数指定的地址');
          throw Error(`无法读取教程（${response.status}）。${command}`);
        }
        const compiled = await response.json();
        if (current !== generation) return;
        player = window.player = mountPlayer(host, compiled, {
          resourceBaseUrl: new URL(url, location.href).href,
          cursorClickEffect: cursorEffectPicker.value,
          cursorMotion: cursorMotionPicker.value,
          async loadVariant(options, signal) {
            if (!example?.variants) throw Error('此示例未准备外观变体，请选择中英文与舞台视频示例');
            const response = await fetch(`/artifacts/playground/tutorial.${options.locale}.json`, {
              signal,
            });
            if (!response.ok) throw Error('外观资源未准备，请运行 pnpm build');
            const scene = await response.json();
            return scene;
          },
        });
        await player.ready;
        if (current !== generation) return;
        themePicker.value = compiled.tutorial.defaults.theme;
        localePicker.value = compiled.tutorial.defaults.locale;
        localePicker.disabled = !example?.variants;
        themePicker.disabled = false;
        window.ready = true;
        const locationUrl = new URL(location.href);
        locationUrl.searchParams.set('scene', url);
        history.replaceState(null, '', locationUrl);
        status.textContent = '';
      } catch (error) {
        if (current !== generation) return;
        player?.dispose();
        host.replaceChildren();
        errorBox.textContent = error.message;
        status.textContent = '';
      } finally {
        if (current === generation) host.setAttribute('aria-busy', 'false');
      }
    }
    async function changeAppearance() {
      const currentPlayer = player;
      if (!currentPlayer) return;
      try {
        await currentPlayer.setOptions({ theme: themePicker.value, locale: localePicker.value });
      } catch (error) {
        if (player !== currentPlayer) return;
        themePicker.value = currentPlayer.appearance.theme;
        localePicker.value = currentPlayer.appearance.locale;
      }
    }
    cursorMotionPicker.addEventListener('change', () => {
      player?.setCursorMotion(cursorMotionPicker.value);
    });
    cursorEffectPicker.addEventListener('change', () => {
      player?.setCursorClickEffect(cursorEffectPicker.value);
    });
    themePicker.addEventListener('change', changeAppearance);
    localePicker.addEventListener('change', changeAppearance);
    window.addEventListener('pagehide', () => {
      generation++;
      controller?.abort();
      player?.dispose();
    });
    window.renderAt = (time) => window.player?.seek(time);
    picker.addEventListener('change', () => loadScene(picker.value));
    document.querySelector('#reload').addEventListener('click', () => loadScene(picker.value));
    await loadScene(initialUrl);
  </script>
</html>
