<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blockdia Motion</title>
  <style>
    body {
      margin: 0;
      background: #e8ebf2;
      font-family: system-ui, sans-serif;
      color: #575e75;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #202126;
        color: #eee;
      }
      a {
        color: #9abaff;
      }
    }
    main {
      max-width: 1280px;
      margin: auto;
    }
    #player {
      display: block;
      width: 100%;
      aspect-ratio: 16/9;
      border: 0;
      background: #17181b;
    }
    .toolbar {
      max-width: 1244px;
      margin: auto;
      padding: 18px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .toolbar button {
      padding: 8px 18px;
    }
    .toolbar select {
      max-width: 100%;
      padding: 8px;
      font: inherit;
    }
    .toolbar p {
      flex-basis: 100%;
      margin: 0;
      font-size: 14px;
    }
    #error {
      max-width: 1244px;
      margin: 0 auto;
      padding: 0 18px;
      overflow-wrap: anywhere;
    }
    #error:empty {
      display: none;
    }
    #error {
      padding: 20px;
      color: #b72929;
    }
  </style>
  <header class="toolbar">
    <label for="tutorial">教程示例</label>
    <select id="tutorial">
      <option value="./artifacts/playground/tutorial.zh-CN.json">
        客户端准备 · 中英文与舞台视频
      </option>
      <option value="./artifacts/all-api/tutorial.json">全部 API · 底层与交互动画</option>
      <option value="./artifacts/structural-editing/tutorial.json">常规代码编辑</option>
      <option value="./artifacts/basic-editing/tutorial.json">基础编辑</option>
      <option value="./artifacts/targets/tutorial.json">多角色与完整工具箱</option>
    </select>
    <button id="reload" type="button">重新加载</button>
    <a id="open-player" target="_blank" rel="noopener">独立播放器</a>
    <label for="locale">语言</label>
    <select id="locale">
      <option value="zh-CN">中文</option>
      <option value="en">English</option>
    </select>
    <p id="description"></p>
  </header>
  <main aria-label="教程预览">
    <iframe id="player" title="教程播放器" allowfullscreen aria-busy="true"></iframe>
  </main>
  <p id="error" role="alert"></p>
  <script type="module">
    const picker = document.querySelector('#tutorial');
    const frame = document.querySelector('#player');
    const errorBox = document.querySelector('#error');
    const localePicker = document.querySelector('#locale');
    const openPlayer = document.querySelector('#open-player');
    const examples = {
      './artifacts/playground/tutorial.zh-CN.json': {
        description:
          '拖动或滚轮平移，Control+滚轮缩放；继续播放恢复视角。播放条的设置按钮可调整倍速、主题与鼠标效果。',
        command: 'pnpm build',
        variants: {
          'zh-CN': './artifacts/playground/tutorial.zh-CN.json',
          en: './artifacts/playground/tutorial.en.json',
        },
      },
      './artifacts/all-api/tutorial.json': {
        description: '底层编辑、工具箱拖动、原生连接阴影、右键菜单、两种删除、自动输入与角色点击。',
        command: 'pnpm example:all-api',
      },
      './artifacts/structural-editing/tutorial.json': {
        description: '容器连接、拆分与删除、长文本输入、模拟输入法、字段菜单和高亮标注。',
        command: 'pnpm example:structural',
      },
      './artifacts/basic-editing/tutorial.json': {
        description: '从工具箱拖出积木、连接、修改参数与粘贴。',
        command: 'pnpm example:basic',
      },
      './artifacts/targets/tutorial.json': {
        description: '切换舞台与角色，浏览各自的完整工具箱和局部数据。',
        command: 'pnpm example:targets',
      },
    };
    const params = new URLSearchParams(location.search);
    const requestedScene = params.get('scene') || picker.value;
    const initialUrl =
      [...Object.keys(examples), './artifacts/playground/tutorial.en.json'].find(
        (scene) =>
          new URL(scene, location.href).href === new URL(requestedScene, location.href).href,
      ) ?? requestedScene;
    if (initialUrl === './artifacts/playground/tutorial.en.json') {
      picker.value = './artifacts/playground/tutorial.zh-CN.json';
      localePicker.value = 'en';
    } else {
      if (![...picker.options].some((option) => option.value === initialUrl))
        picker.add(new Option('自定义教程', initialUrl));
      picker.value = initialUrl;
    }
    let generation = 0,
      life;
    let themePreference = params.get('theme') ?? 'system';
    window.ready = false;
    function loadScene(preserve = false) {
      const previous = window.ready ? frame.contentWindow.player : undefined;
      const snapshot =
        preserve && previous
          ? {
              time: previous.time,
              rate: previous.playbackRate,
              motion: previous.cursorMotion,
              effect: previous.cursorClickEffect,
            }
          : undefined;
      if (window.ready) themePreference = frame.contentWindow.themePreference;
      const current = ++generation;
      life?.abort();
      life = new AbortController();
      window.ready = false;
      frame.setAttribute('aria-busy', 'true');
      errorBox.textContent = '';
      const example = Object.hasOwn(examples, picker.value) ? examples[picker.value] : undefined;
      const scene = example?.variants?.[localePicker.value] ?? picker.value;
      localePicker.disabled = !example?.variants;
      document.querySelector('#description').textContent =
        example?.description || '预览指定的已编译教程。';
      const url = new URL('./player/', location.href);
      url.searchParams.set('scene', new URL(scene, location.href).href);
      if (example?.variants) url.searchParams.set('locale', localePicker.value);
      if (themePreference !== 'system') url.searchParams.set('theme', themePreference);
      openPlayer.href = url.href;
      const locationUrl = new URL(location.href);
      locationUrl.searchParams.set('scene', scene);
      if (themePreference === 'system') locationUrl.searchParams.delete('theme');
      else locationUrl.searchParams.set('theme', themePreference);
      history.replaceState(null, '', locationUrl);
      frame.onload = () => {
        if (current !== generation) return;
        const child = frame.contentWindow;
        if (child.location.href !== url.href) return;
        const on = { signal: life.signal };
        async function ready() {
          if (current !== generation) return;
          try {
            if (snapshot) {
              child.player.setPlaybackRate(snapshot.rate);
              child.player.setCursorMotion(snapshot.motion);
              child.player.setCursorClickEffect(snapshot.effect);
              await child.player.seek(snapshot.time);
            }
            if (current !== generation) return;
            localePicker.value = child.player.appearance.locale;
            window.ready = true;
            frame.setAttribute('aria-busy', 'false');
          } catch (error) {
            failed({ detail: error.message });
          }
        }
        function failed(event) {
          if (current !== generation) return;
          frame.setAttribute('aria-busy', 'false');
          errorBox.textContent = `${event.detail}${example?.command ? '。请运行 ' + example.command : ''}`;
        }
        child.addEventListener('motion-ready', ready, on);
        child.addEventListener('motion-error', failed, on);
        child.addEventListener(
          'motion-theme-change',
          () => {
            if (current !== generation) return;
            themePreference = child.themePreference;
            openPlayer.href = child.location.href;
            const locationUrl = new URL(location.href);
            if (themePreference === 'system') locationUrl.searchParams.delete('theme');
            else locationUrl.searchParams.set('theme', themePreference);
            history.replaceState(null, '', locationUrl);
          },
          on,
        );
        if (child.ready) void ready();
        else if (child.document.querySelector('#message')?.getAttribute('role') === 'alert')
          failed({ detail: child.document.querySelector('#message').textContent });
      };
      frame.src = url.href;
    }
    openPlayer.addEventListener('click', () => {
      if (window.ready) {
        const url = new URL(frame.contentWindow.location.href);
        openPlayer.href = url.href;
      }
    });
    picker.addEventListener('change', () => loadScene());
    document.querySelector('#reload').addEventListener('click', () => loadScene());
    localePicker.addEventListener('change', () => loadScene(true));
    window.addEventListener('pagehide', () => {
      generation++;
      life?.abort();
      window.ready = false;
    });
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) location.reload();
    });
    loadScene();
  </script>
</html>
